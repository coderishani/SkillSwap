{% extends "base.html" %}

{% block content %}

    <h1>Delete Skill</h1>

    <p>
        Are you sure you want to delete 
        <strong>{{ skill.name }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

        <a href="{% url 'my_skills' %}">
            Cancel
        </a>

    </form>

{% endblock %}
